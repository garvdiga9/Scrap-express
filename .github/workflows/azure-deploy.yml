# Puts the site on Azure App Service. It runs only when started by hand
# (GitHub → Actions → "Deploy to Azure" → Run workflow), so Render keeps
# working untouched until the move is finished (see docs/AZURE-MOVE.md).
# Once Azure is the live host, add "push: branches: [main]" under "on:" to
# deploy every change automatically.
#
# Needs two settings in GitHub → Settings → Secrets and variables → Actions:
#   AZURE_WEBAPP_NAME             (variable) the App Service name, e.g. scrapdilli
#   AZURE_WEBAPP_PUBLISH_PROFILE  (secret)   App Service → Overview → Download publish profile
name: Deploy to Azure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
