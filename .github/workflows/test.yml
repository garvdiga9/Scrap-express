# Runs the tests (npm test) on GitHub for every push and pull request, against
# a fresh, empty database, never the live one. A red cross on the commit means
# something broke; the "Tests" log shows which check failed.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scrap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/scrap_test
      SESSION_SECRET: github-actions-test-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test-admin-password
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
