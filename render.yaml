databases:
  - name: scrap-express-db
    plan: basic-256mb
    # Must match the web service: the private connection string only
    # resolves between services in the same region.
    region: singapore
    postgresMajorVersion: "17"

services:
  - type: web
    name: scrap-express
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: node db/migrate.js && node db/seed.js && node server.js
    # Customer photos/videos. The service's own filesystem is wiped on every
    # deploy, so uploads go on a persistent disk (can be enlarged later, not shrunk).
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: scrap-express-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # Customer login (Firebase). Set these in the Render dashboard; until they
      # are set, customer login stays switched off and the site works as before.
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
