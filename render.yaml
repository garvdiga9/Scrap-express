databases:
  - name: kabadi-express-db
    plan: basic-256mb
    postgresMajorVersion: "17"

services:
  - type: web
    name: kabadi-express
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: node db/migrate.js && node db/seed.js && node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kabadi-express-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
